name: Deploy ke cPanel

# Tiap push ke main langsung naik ke server.
# Kalau mau MANUAL doang (lebih aman buat produksi), hapus blok "push:" di bawah —
# nanti deploy cuma jalan kalau lo pencet tombol "Run workflow" di tab Actions.
on:
  push:
    branches: [main]
    paths:
      - 'backoffice.svashtahome.com/**'
      - 'backoffice-shared/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-cpanel
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Diagnosa kredensial — SEMENTARA, hapus setelah deploy jalan.
      # Sengaja TIDAK nge-print nilai apa pun (repo ini public, log Actions kebaca umum):
      # cuma ngecek secret-nya keisi atau nggak, dan ada spasi nyasar atau nggak.
      - name: Cek kredensial FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          fail=0

          check_empty() {
            if [ -z "$2" ]; then
              echo "KOSONG   $1  <-- secret tidak ada, atau namanya salah ketik"
              fail=1
            else
              echo "TERISI   $1"
            fi
          }
          check_empty FTP_SERVER   "$FTP_SERVER"
          check_empty FTP_USERNAME "$FTP_USERNAME"
          check_empty FTP_PASSWORD "$FTP_PASSWORD"

          # Spasi/newline nyasar di awal atau akhir — penyebab 530 yang paling gak kelihatan.
          trimmed=$(printf '%s' "$FTP_PASSWORD" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          if [ -n "$FTP_PASSWORD" ] && [ "$FTP_PASSWORD" != "$trimmed" ]; then
            echo "SPASI    FTP_PASSWORD  <-- ada spasi/newline di awal atau akhir"
            fail=1
          fi

          case "$FTP_USERNAME" in
            "")   ;;
            *[[:space:]]*) echo "SPASI    FTP_USERNAME  <-- ada spasi di dalam nilainya"; fail=1 ;;
            *@*)  echo "FORMAT   FTP_USERNAME sudah user@domain (bener)" ;;
            *)    echo "SALAH    FTP_USERNAME tidak ada @domain -- cPanel pasti nolak"; fail=1 ;;
          esac

          case "$FTP_SERVER" in
            *://*) echo "SALAH    FTP_SERVER masih pakai awalan protokol (ftp://) -- buang"; fail=1 ;;
            */*)   echo "SALAH    FTP_SERVER mengandung garis miring -- isi hostname saja"; fail=1 ;;
            *:*)   echo "SALAH    FTP_SERVER mengandung port -- isi hostname saja"; fail=1 ;;
          esac

          if [ "$fail" -eq 0 ]; then
            echo "---"
            echo "Bentuk semua kredensial lolos. Kalau login tetap 530,"
            echo "berarti username/password-nya memang salah di sisi cPanel."
          fi
          exit "$fail"

      # --- Webroot subdomain ---
      - name: Upload webroot
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./backoffice.svashtahome.com/
          server-dir: backoffice.svashtahome.com/
          dry-run: true   # <-- PERCOBAAN PERTAMA: cuma simulasi, server tidak disentuh
          # File di server yang cocok pola ini TIDAK diupload DAN TIDAK dihapus.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            uploads/**
            **/uploads/**
            .ftpquota
            error_log
            **/error_log
            **/*.log

      # --- Kode share di luar webroot ---
      - name: Upload backoffice-shared
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./backoffice-shared/
          server-dir: backoffice-shared/
          dry-run: true   # <-- PERCOBAAN PERTAMA: cuma simulasi, server tidak disentuh
          # config.php = kredensial DB asli, cuma ada di server. JANGAN disentuh.
          exclude: |
            **/.git*
            **/.git*/**
            config.php
            config.local.php
            **/*.log
